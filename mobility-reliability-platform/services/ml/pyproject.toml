[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mobility-reliability-ml"
version = "0.1.0"
description = "Reproducible CPU-only data and evaluation utilities for the mobility reliability platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema[format]>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.12,<0.13",
]

[project.scripts]
r07-generate-dataset = "mobility_ml.generate_r07_dataset:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mobility_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
